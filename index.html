<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>引っ越しごみナビ</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="hero">
        <div class="hero-inner">
          <div>
            <p class="hero-sub">引っ越しサポート</p>
            <h1 class="hero-title">引っ越しごみナビ</h1>
          </div>
          <div class="icon-badge" aria-label="ロゴ">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="24" height="24">
              <path d="M6 9.5V7a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2.5"></path>
              <path d="M5 9.5h14l-1.12 8.73A2 2 0 0 1 15.9 20h-7.8a2 2 0 0 1-1.98-1.77L5 9.5Z"></path>
              <path d="M9 12h6"></path>
            </svg>
          </div>
        </div>
      </header>

      <main class="main">
        <section class="panel">
          <div class="field">
            <label class="label" for="previous-city">引っ越し前の自治体</label>
            <div class="select-wrap">
              <select id="previous-city"></select>
              <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                <path d="m6 9 6 6 6-6"></path>
              </svg>
            </div>
          </div>

          <div class="field">
            <label class="label" for="new-city">新しい自治体</label>
            <div class="select-wrap">
              <select id="new-city"></select>
              <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                <path d="m6 9 6 6 6-6"></path>
              </svg>
            </div>
          </div>

          <div class="field">
            <label class="label" for="item-search">品目検索</label>
            <div class="search-row">
              <div class="search-input-wrap">
                <input id="item-search" type="text" value="布団" placeholder="例: 布団, ベッド, テレビ" />
                <button type="button" id="search-icon-btn" class="search-icon-btn" aria-label="検索">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                    <circle cx="11" cy="11" r="6"></circle>
                    <path d="m16 16 5 5"></path>
                  </svg>
                </button>
              </div>

              <label class="camera-btn" aria-label="カメラ撮影">
                <input id="camera-input" type="file" accept="image/*" capture="environment" />
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22">
                  <path d="M7 16.5A3.5 3.5 0 0 1 7 9.5l1.2-1.2a3 3 0 0 1 4.2 0l.3.3a3 3 0 0 1 4.2 4.2L16 16.5a3.5 3.5 0 0 1-9 0Z"></path>
                  <path d="M12 9.5v7"></path>
                  <path d="M9.5 12h5"></path>
                </svg>
              </label>
            </div>
          </div>

          <button type="button" id="search-btn" class="search-button">検索する</button>
        </section>

        <section id="result-section" class="result-section hidden">
          <div class="results-header">
            <div class="results-title">検索結果</div>
            <div class="count-badge">比較結果</div>
          </div>

          <article class="result-card">
            <div class="result-top">
              <div class="result-tag">比較結果</div>
              <div id="route-label" class="result-sub">世田谷区 → 中野区</div>
            </div>

            <div class="result-body">
              <div class="comparison-box">
                <div class="comparison-header">
                  <div class="comparison-title">分別ルールの差分</div>
                  <div id="comparison-item" class="item-pill">品目: 布団</div>
                </div>

                <div class="compare-grid">
                  <div class="compare-panel left">
                    <div class="compare-label">引っ越し前</div>
                    <div id="previous-city-name" class="compare-city">世田谷区</div>
                    <div id="previous-rule" class="compare-note">粗大ごみ対象</div>
                  </div>

                  <div class="compare-panel right">
                    <div class="compare-label">新しい街</div>
                    <div id="new-city-name" class="compare-city">中野区</div>
                    <div id="new-rule" class="compare-note">有料の大型ごみ扱い</div>
                  </div>
                </div>
              </div>

              <div class="info-stack">
                <div class="info-box">
                  <div class="info-label">アドバイス</div>
                  <div id="advice" class="info-text"></div>
                </div>

                <div class="info-box">
                  <div class="info-label">前後の街の分別差分</div>
                  <div id="diff-summary" class="info-text"></div>
                </div>

                <div class="info-box">
                  <div class="info-label">粗大ごみ窓口案内</div>
                  <div id="contact" class="info-text"></div>
                </div>
              </div>
            </div>
          </article>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
