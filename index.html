<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>引っ越しごみナビ</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="hero">
        <div class="hero-inner">
          <div>
            <p class="hero-sub">引っ越しサポート</p>
            <h1 class="hero-title">引っ越しごみナビ</h1>
          </div>
          <div class="icon-badge" aria-label="ロゴ">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="24" height="24">
              <path d="M6 9.5V7a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2.5"></path>
              <path d="M5 9.5h14l-1.12 8.73A2 2 0 0 1 15.9 20h-7.8a2 2 0 0 1-1.98-1.77L5 9.5Z"></path>
              <path d="M9 12h6"></path>
            </svg>
          </div>
        </div>
      </header>

      <main class="main">
        <section class="panel" aria-labelledby="search-heading">
          <h2 id="search-heading" class="form-heading">ごみの出し方を調べる</h2>

          <div class="comparison-selectors">
            <fieldset class="city-fieldset">
              <legend class="label">引っ越し前</legend>

              <div class="field">
                <label class="label" for="previous-city">自治体</label>
                <div class="select-wrap">
                  <select id="previous-city"></select>
                  <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" aria-hidden="true">
                    <path d="m6 9 6 6 6-6"></path>
                  </svg>
                </div>
              </div>

              <div class="field">
                <label class="label" for="previous-town">町名</label>
                <div class="select-wrap">
                  <select id="previous-town" disabled>
                    <option value="">町名を選択</option>
                  </select>
                  <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" aria-hidden="true">
                    <path d="m6 9 6 6 6-6"></path>
                  </svg>
                </div>
              </div>

              <div class="field">
                <label class="label" for="previous-block">丁目</label>
                <div class="select-wrap">
                  <select id="previous-block" disabled>
                    <option value="">丁目を選択</option>
                  </select>
                  <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" aria-hidden="true">
                    <path d="m6 9 6 6 6-6"></path>
                  </svg>
                </div>
              </div>
            </fieldset>

            <fieldset class="city-fieldset">
              <legend class="label">引っ越し後</legend>

              <div class="field">
                <label class="label" for="new-city">自治体</label>
                <div class="select-wrap">
                  <select id="new-city"></select>
                  <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" aria-hidden="true">
                    <path d="m6 9 6 6 6-6"></path>
                  </svg>
                </div>
              </div>

              <div class="field">
                <label class="label" for="new-town">町名</label>
                <div class="select-wrap">
                  <select id="new-town" disabled>
                    <option value="">町名を選択</option>
                  </select>
                  <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" aria-hidden="true">
                    <path d="m6 9 6 6 6-6"></path>
                  </svg>
                </div>
              </div>

              <div class="field">
                <label class="label" for="new-block">丁目</label>
                <div class="select-wrap">
                  <select id="new-block" disabled>
                    <option value="">丁目を選択</option>
                  </select>
                  <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" aria-hidden="true">
                    <path d="m6 9 6 6 6-6"></path>
                  </svg>
                </div>
              </div>
            </fieldset>
          </div>

          <div class="field">
            <label class="label" for="item-search">品目</label>
            <div class="search-row">
              <div class="search-input-wrap">
                <input
                  id="item-search"
                  type="search"
                  placeholder="例：アタッシュケース、足ふきマット"
                  autocomplete="off"
                />
                <button type="button" id="search-icon-btn" class="search-icon-btn" aria-label="品目を検索">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18" aria-hidden="true">
                    <circle cx="11" cy="11" r="6"></circle>
                    <path d="m16 16 5 5"></path>
                  </svg>
                </button>
              </div>

              <label class="camera-btn" aria-label="写真を撮影またはアップロード">
                <input id="camera-input" type="file" accept="image/*" capture="environment" />
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22" aria-hidden="true">
                  <path d="M4 8h3l1.5-2h7L17 8h3v11H4z"></path>
                  <circle cx="12" cy="13" r="3"></circle>
                </svg>
              </label>
            </div>
            <p class="field-hint">写真判定はデモ用のモックです。画像は認識・送信されません。</p>
          </div>

          <button type="button" id="search-btn" class="search-button">分別ルールを検索</button>
          <p id="error-message" class="error-message" role="alert"></p>
        </section>

        <section id="result-section" class="result-section hidden" aria-live="polite">
          <div class="results-header">
            <h2 class="results-title">自治体ごとの比較</h2>
            <span class="count-badge">検索結果</span>
          </div>

          <p id="matched-item" class="matched-item"></p>

          <div class="comparison-results">
            <article class="result-card">
              <div class="result-top">
                <span class="result-tag">引っ越し前</span>
                <span id="previous-location" class="result-sub"></span>
              </div>
              <div class="result-body">
                <dl class="result-details">
                  <div>
                    <dt>品目</dt>
                    <dd id="previous-item"></dd>
                  </div>
                  <div>
                    <dt>分別カテゴリ</dt>
                    <dd id="previous-category"></dd>
                  </div>
                  <div>
                    <dt>収集曜日</dt>
                    <dd id="previous-day"></dd>
                  </div>
                </dl>
                <p id="previous-note" class="info-text"></p>
              </div>
            </article>

            <article class="result-card">
              <div class="result-top">
                <span class="result-tag">引っ越し後</span>
                <span id="new-location" class="result-sub"></span>
              </div>
              <div class="result-body">
                <dl class="result-details">
                  <div>
                    <dt>品目</dt>
                    <dd id="new-item"></dd>
                  </div>
                  <div>
                    <dt>分別カテゴリ</dt>
                    <dd id="new-category"></dd>
                  </div>
                  <div>
                    <dt>収集曜日</dt>
                    <dd id="new-day"></dd>
                  </div>
                </dl>
                <p id="new-note" class="info-text"></p>
              </div>
            </article>
          </div>

          <div id="photo-mock-result" class="photo-mock-result hidden" role="status"></div>
        </section>
      </main>

      <script type="module" src="script.js"></script>
    </div>

    <script src="script.js"></script>
  </body>
</html>
