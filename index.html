<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>引っ越しごみナビ</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="hero">
        <div class="hero-inner">
          <div>
            <p class="hero-sub">引っ越しサポート</p>
            <h1 class="hero-title">引っ越しごみナビ</h1>
          </div>
          <div class="icon-badge" aria-label="ロゴ">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="24" height="24">
              <path d="M6 9.5V7a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2.5"></path>
              <path d="M5 9.5h14l-1.12 8.73A2 2 0 0 1 15.9 20h-7.8a2 2 0 0 1-1.98-1.77L5 9.5Z"></path>
              <path d="M9 12h6"></path>
            </svg>
          </div>
        </div>
      </header>

      <main class="main">
        <section class="panel">
          <div class="field">
            <label class="label" for="municipality">自治体</label>
            <div class="select-wrap">
              <select id="municipality" required>
                <option value="nakano">中野区</option>
                <option value="setagaya">世田谷区</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label class="label" for="town">町名</label>
            <input
              id="town"
              type="text"
              list="town-options"
              placeholder="例：新井"
              autocomplete="off"
              required
            />
            <datalist id="town-options"></datalist>
          </div>

          <div class="field">
            <label class="label" for="block">丁目</label>
            <div class="select-wrap">
              <select id="block" required>
                <option value="">町名を先に入力してください</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label class="label" for="item-search">品目</label>
            <input
              id="item-search"
              type="search"
              placeholder="例：布団、ペットボトル"
              autocomplete="off"
              required
            />
          </div>

          <button type="button" id="search-btn" class="search-button">
            収集ルールを調べる
          </button>
        </section>

        <section id="result-section" class="result-section hidden" aria-live="polite">
          <h2 class="results-title">検索結果</h2>

          <article class="result-card">
            <p id="result-status" class="result-status"></p>
            <dl class="result-details">
              <div>
                <dt>自治体・地域</dt>
                <dd id="result-location"></dd>
              </div>
              <div>
                <dt>品目</dt>
                <dd id="result-item"></dd>
              </div>
              <div>
                <dt>分別カテゴリ</dt>
                <dd id="result-category"></dd>
              </div>
              <div>
                <dt>収集曜日</dt>
                <dd id="result-day"></dd>
              </div>
            </dl>
            <p id="result-note" class="info-text"></p>
          </article>
        </section>

        <p id="error-message" class="error-message" role="alert"></p>

        <script type="module" src="script.js"></script>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
