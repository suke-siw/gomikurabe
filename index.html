<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10b981" />
    <title>引っ越しごみナビ</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="hero">
        <div class="hero-inner">
          <div>
            <p class="hero-sub">引っ越しサポート</p>
            <h1 class="hero-title">引っ越しごみナビ</h1>
          </div>
          <div class="icon-badge" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="24" height="24">
              <path d="M6 9.5V7a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2.5"></path>
              <path d="M5 9.5h14l-1.12 8.73A2 2 0 0 1 15.9 20h-7.8a2 2 0 0 1-1.98-1.77L5 9.5Z"></path>
              <path d="M9 12h6"></path>
            </svg>
          </div>
        </div>
      </header>

      <nav class="tabs" role="tablist" aria-label="画面切り替え">
        <button
          id="tab-compare"
          class="tab-button is-active"
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="panel-compare"
          data-tab-target="panel-compare"
        >
          自治体比較一覧
        </button>
        <button
          id="tab-navi"
          class="tab-button"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="panel-navi"
          data-tab-target="panel-navi"
        >
          個別検索・写真判定
        </button>
      </nav>

      <main class="main">
        <section
          id="panel-compare"
          class="tab-panel"
          role="tabpanel"
          aria-labelledby="tab-compare"
        >
          <section class="panel">
            <div class="section-heading">
              <div>
                <p class="eyebrow">自治体間のルールをチェック</p>
                <h2 class="panel-title">自治体比較一覧</h2>
              </div>
              <span id="common-item-count" class="count-badge">読み込み中</span>
            </div>

            <div class="city-select-grid">
              <div class="field">
                <label class="label" for="compare-previous-city">引っ越し前</label>
                <div class="select-wrap">
                  <select id="compare-previous-city"></select>
                  <span class="select-chevron" aria-hidden="true">⌄</span>
                </div>
              </div>

              <div class="field">
                <label class="label" for="compare-new-city">引っ越し後</label>
                <div class="select-wrap">
                  <select id="compare-new-city"></select>
                  <span class="select-chevron" aria-hidden="true">⌄</span>
                </div>
              </div>
            </div>

            <div class="field">
              <label class="label" for="comparison-search">品目を絞り込む</label>
              <input
                id="comparison-search"
                type="search"
                placeholder="品目名を入力"
                autocomplete="off"
              />
            </div>

            <p id="comparison-message" class="inline-message" aria-live="polite"></p>
          </section>

          <section id="comparison-results" class="comparison-list" aria-live="polite"></section>
        </section>

        <section
          id="panel-navi"
          class="tab-panel hidden"
          role="tabpanel"
          aria-labelledby="tab-navi"
          hidden
        >
          <section class="panel">
            <p class="eyebrow">引っ越し前後の地域を指定</p>
            <h2 class="panel-title">個別検索・写真判定</h2>

            <div class="comparison-selectors">
              <fieldset class="city-fieldset">
                <legend class="fieldset-title">引っ越し前</legend>

                <div class="field">
                  <label class="label" for="previous-city">自治体</label>
                  <div class="select-wrap">
                    <select id="previous-city"></select>
                    <span class="select-chevron" aria-hidden="true">⌄</span>
                  </div>
                </div>

                <div class="field">
                  <label class="label" for="previous-town">町名</label>
                  <div class="select-wrap">
                    <select id="previous-town" disabled>
                      <option value="">町名を選択</option>
                    </select>
                    <span class="select-chevron" aria-hidden="true">⌄</span>
                  </div>
                </div>

                <div class="field">
                  <label class="label" for="previous-block">丁目</label>
                  <div class="select-wrap">
                    <select id="previous-block" disabled>
                      <option value="">丁目を選択</option>
                    </select>
                    <span class="select-chevron" aria-hidden="true">⌄</span>
                  </div>
                </div>
              </fieldset>

              <fieldset class="city-fieldset">
                <legend class="fieldset-title">引っ越し後</legend>

                <div class="field">
                  <label class="label" for="new-city">自治体</label>
                  <div class="select-wrap">
                    <select id="new-city"></select>
                    <span class="select-chevron" aria-hidden="true">⌄</span>
                  </div>
                </div>

                <div class="field">
                  <label class="label" for="new-town">町名</label>
                  <div class="select-wrap">
                    <select id="new-town" disabled>
                      <option value="">町名を選択</option>
                    </select>
                    <span class="select-chevron" aria-hidden="true">⌄</span>
                  </div>
                </div>

                <div class="field">
                  <label class="label" for="new-block">丁目</label>
                  <div class="select-wrap">
                    <select id="new-block" disabled>
                      <option value="">丁目を選択</option>
                    </select>
                    <span class="select-chevron" aria-hidden="true">⌄</span>
                  </div>
                </div>
              </fieldset>
            </div>

            <div class="field item-field">
              <label class="label" for="item-search">品目</label>
              <div class="search-row">
                <input
                  id="item-search"
                  type="search"
                  placeholder="例：びん、アタッシュケース"
                  autocomplete="off"
                />
                <label class="camera-btn" aria-label="写真を撮影または選択">
                  <input id="camera-input" type="file" accept="image/*" capture="environment" />
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22" aria-hidden="true">
                    <path d="M4 8h3l1.5-2h7L17 8h3v11H4z"></path>
                    <circle cx="12" cy="13" r="3"></circle>
                  </svg>
                </label>
              </div>
              <p class="field-hint">写真判定はデモ用のモックです。画像は認識・送信されません。</p>
            </div>

            <div id="search-suggestions" class="search-suggestions hidden" role="listbox" aria-label="品目候補"></div>

            <button type="button" id="search-button" class="search-button">
              引っ越し前後を比較
            </button>
            <p id="search-error" class="error-message" role="alert"></p>
          </section>

          <section id="search-result" class="search-result hidden" aria-live="polite">
            <div class="results-header">
              <h2 class="results-title">検索結果</h2>
              <p id="matched-item" class="matched-item"></p>
            </div>

            <div class="individual-comparison">
              <article class="result-card">
                <div class="result-top">
                  <span class="result-tag">引っ越し前</span>
                  <span id="previous-location" class="result-sub"></span>
                </div>
                <div class="result-body">
                  <dl class="result-details">
                    <div>
                      <dt>品目</dt>
                      <dd id="previous-item"></dd>
                    </div>
                    <div>
                      <dt>分別カテゴリ</dt>
                      <dd id="previous-category"></dd>
                    </div>
                    <div>
                      <dt>収集曜日</dt>
                      <dd id="previous-day"></dd>
                    </div>
                  </dl>
                  <p id="previous-note" class="info-text"></p>
                </div>
              </article>

              <article class="result-card">
                <div class="result-top">
                  <span class="result-tag">引っ越し後</span>
                  <span id="new-location" class="result-sub"></span>
                </div>
                <div class="result-body">
                  <dl class="result-details">
                    <div>
                      <dt>品目</dt>
                      <dd id="new-item"></dd>
                    </div>
                    <div>
                      <dt>分別カテゴリ</dt>
                      <dd id="new-category"></dd>
                    </div>
                    <div>
                      <dt>収集曜日</dt>
                      <dd id="new-day"></dd>
                    </div>
                  </dl>
                  <p id="new-note" class="info-text"></p>
                </div>
              </article>
            </div>

            <div id="photo-mock-result" class="photo-mock-result hidden" role="status"></div>
          </section>
        </section>

        <p id="data-error" class="error-message" role="alert"></p>
      </main>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
